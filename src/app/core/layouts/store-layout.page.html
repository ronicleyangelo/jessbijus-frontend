<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

<div class="site-shell">
  <div class="announcement">Pedidos pelo WhatsApp <span aria-hidden="true">•</span> Atendimento personalizado</div>

  <header class="site-header">
    <div class="site-header__main container-fluid">
      <div class="row align-items-center gx-4">
      <div class="site-header__brand col-9 col-lg-3">
      <button
        class="menu-button"
        type="button"
        [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
        aria-controls="store-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <fa-icon [icon]="menuOpen() ? closeIcon : menuIcon" />
      </button>
      <app-brand />
      </div>

      <form class="site-search-wrap col-12 col-lg-5" role="search" (submit)="searchProducts($event, searchInput.value)">
        <div class="site-search">
        <label class="visually-hidden" for="product-search">Buscar produtos</label>
        <input id="product-search" #searchInput type="search" [value]="activeSearch()" placeholder="Buscar em todos os produtos" />
        <button type="submit" aria-label="Buscar"><fa-icon [icon]="searchIcon" /></button>
        </div>
      </form>

      <div class="site-header__actions col-3 col-lg-4">
        <a class="admin-link" routerLink="/admin">Área da loja</a>
        <a class="list-link" routerLink="/minha-lista" [attr.aria-label]="'Minha lista, ' + cart.itemCount() + ' peças'">
          <fa-icon [icon]="cartIcon" aria-hidden="true" />
          <span>Minha lista <span class="list-count">({{ cart.itemCount() }})</span></span>
        </a>
      </div>
      </div>
    </div>

    <nav id="store-navigation" class="site-navigation" [class.site-navigation--open]="menuOpen()" aria-label="Categorias da loja">
      <div class="site-navigation__inner">
        <a routerLink="/colecao" [queryParams]="{ busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'todos'" (click)="closeMenu()">Todos</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'novidades', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'novidades'" (click)="closeMenu()">Novidades</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'brincos', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'brincos'" (click)="closeMenu()">Brincos</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'colares', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'colares'" (click)="closeMenu()">Colares</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'pulseiras', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'pulseiras'" (click)="closeMenu()">Pulseiras</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'conjuntos', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'conjuntos'" (click)="closeMenu()">Conjuntos</a>
        <a routerLink="/colecao" [queryParams]="{ categoria: 'mais-vendidos', busca: activeSearch() || null }" [class.site-navigation__active]="activeCategory() === 'mais-vendidos'" (click)="closeMenu()">Mais vendidos</a>
      </div>
    </nav>
  </header>

  <main id="conteudo" class="site-content" tabindex="-1"><router-outlet /></main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <a routerLink="/">JESSBIJUS</a>
        <span>Cada detalhe, um carinho.</span>
      </div>
      <div class="site-footer__contact">
        <strong>Atendimento</strong>
        <div class="site-footer__contact-links">
          <a href="https://wa.me/5527992710806" target="_blank" rel="noopener noreferrer"><fa-icon [icon]="whatsappIcon" aria-hidden="true" /> WhatsApp</a>
          <a href="https://instagram.com/jessbijus_/" target="_blank" rel="noopener noreferrer"><fa-icon [icon]="instagramIcon" aria-hidden="true" /> @jessbijus</a>
        </div>
      </div>
      <p>Pedidos por WhatsApp <span aria-hidden="true">•</span> Pix combinado</p>
    </div>
  </footer>
</div>
