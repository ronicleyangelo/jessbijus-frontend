<article class="product-card">
  <a class="product-card__details-link" [routerLink]="['/produto', product().id]" [attr.aria-label]="'Ver detalhes de ' + product().name"></a>
  <div class="product-card__media">
    <img [class]="'product-card__image product-card__image--' + product().id" [src]="product().imageUrl" [alt]="product().imageAlt" loading="lazy" />
    @if (product().badge) {
      <span class="product-card__badge">{{ product().badge }}</span>
    }
    <button
      class="product-card__favorite"
      type="button"
      [attr.aria-label]="isFavorite() ? 'Remover ' + product().name + ' dos favoritos' : 'Favoritar ' + product().name"
      [attr.aria-pressed]="isFavorite()"
      (click)="toggleFavorite()"
    >
      <fa-icon [icon]="isFavorite() ? heartSolid : heartRegular" />
    </button>
  </div>
  <h3>{{ product().name }}</h3>
  <p class="product-card__price">{{ product().price | currency:'BRL':'symbol':'1.2-2' }}</p>
  <button class="product-card__cta" type="button" (click)="addToList()">
    <span class="product-card__cta-desktop">Pedir pelo WhatsApp</span>
    <span class="product-card__cta-mobile">Pedir no WhatsApp</span>
  </button>
</article>
